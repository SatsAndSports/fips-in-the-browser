<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIPS Browser Node</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --muted: #888;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --mono: "Fira Code", "Cascadia Code", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 1.25rem;
    width: 100%;
    max-width: 700px;
    margin-bottom: 1rem;
  }
  .panel-title {
    font-size: 0.85rem;
    color: var(--blue);
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 0.4rem;
  }
  label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.6rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--highlight); }
  .info-row {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    word-break: break-all;
  }
  .info-row span { color: var(--text); }
  button {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.45rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-right: 0.5rem;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-connect { background: var(--highlight); color: #fff; }
  .btn-send { background: var(--green); color: #111; }
  .status { font-size: 0.78rem; margin-top: 0.5rem; }
  .status.connected { color: var(--green); }
  .status.disconnected { color: var(--red); }
  .status.connecting { color: #facc15; }
  .status.handshaking { color: #c084fc; }
  #sendRow { display: flex; gap: 0.5rem; }
  #sendRow input { flex: 1; margin-bottom: 0; }
  #log {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.75rem;
    height: 350px;
    overflow-y: auto;
    font-size: 0.72rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-send { color: var(--green); }
  .log-recv { color: var(--blue); }
  .log-info { color: var(--muted); }
  .log-err  { color: var(--red); }
  .log-hs   { color: #c084fc; }
</style>
</head>
<body>

<h1>FIPS Browser Node</h1>
<p class="subtitle">real Noise IK handshake + encrypted FMP frames over WebSocket</p>

<!-- Identity panel -->
<div class="panel">
  <div class="panel-title">Identity</div>
  <div class="info-row">npub: <span id="myNpub">loading WASM...</span></div>
  <div class="info-row">addr: <span id="myAddr"></span></div>
</div>

<!-- Connection panel -->
<div class="panel">
  <div class="panel-title">Connect to FIPS Node</div>
  <label for="url">WebSocket URL</label>
  <input type="text" id="url" value="ws://localhost:8080">
  <label for="remoteNpub">Remote node npub</label>
  <input type="text" id="remoteNpub" placeholder="npub1...">
  <div>
    <button class="btn-connect" id="btnConnect" disabled>Connect + Handshake</button>
  </div>
  <div class="status disconnected" id="status">Loading WASM...</div>
</div>

<!-- Send panel -->
<div class="panel">
  <div class="panel-title">Send Data</div>
  <div id="sendRow">
    <input type="text" id="msg" placeholder="Type a message..." disabled>
    <button class="btn-send" id="btnSend" disabled>Send</button>
  </div>
</div>

<!-- Log panel -->
<div class="panel">
  <div class="panel-title">Protocol Log</div>
  <div id="log"></div>
</div>

<script type="module">
import init, { FipsNode } from '../pkg/fips_wasm.js';

// ── DOM refs ──────────────────────────────────────────
const $myNpub      = document.getElementById('myNpub');
const $myAddr      = document.getElementById('myAddr');
const $url         = document.getElementById('url');
const $remoteNpub  = document.getElementById('remoteNpub');
const $btnConnect  = document.getElementById('btnConnect');
const $status      = document.getElementById('status');
const $msg         = document.getElementById('msg');
const $btnSend     = document.getElementById('btnSend');
const $log         = document.getElementById('log');

let node = null;
let ws = null;

// ── Helpers ───────────────────────────────────────────

function log(cls, text) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = text + '\n';
  $log.appendChild(span);
  $log.scrollTop = $log.scrollHeight;
}

function setStatus(text, cls) {
  $status.textContent = text;
  $status.className = 'status ' + cls;
}

// ── Initialize WASM ───────────────────────────────────

await init();

node = new FipsNode();
$myNpub.textContent = node.npub();
$myAddr.textContent = node.node_addr_hex();
$btnConnect.disabled = false;
setStatus('Ready', 'disconnected');
log('log-info', `WASM loaded. Browser FIPS node initialized.`);
log('log-info', `npub: ${node.npub()}`);
log('log-info', `addr: ${node.node_addr_hex()}`);

// ── Connect + Handshake ───────────────────────────────

$btnConnect.addEventListener('click', () => {
  const url = $url.value.trim();
  const remoteNpub = $remoteNpub.value.trim();

  if (!url || !remoteNpub) {
    log('log-err', 'URL and remote npub are required.');
    return;
  }

  $btnConnect.disabled = true;
  setStatus('Connecting...', 'connecting');
  log('log-info', `Connecting to ${url}...`);

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    log('log-info', 'WebSocket connected.');

    // Initiate Noise IK handshake
    setStatus('Handshaking...', 'handshaking');
    log('log-hs', `Initiating Noise IK handshake with ${remoteNpub.slice(0,12)}...`);

    try {
      const msg1 = node.initiate_handshake(remoteNpub);
      log('log-hs', `Sent msg1 (${msg1.length} bytes)`);
      ws.send(msg1);
    } catch (e) {
      log('log-err', `Handshake failed: ${e}`);
      setStatus('Disconnected', 'disconnected');
      $btnConnect.disabled = false;
    }
  };

  ws.onmessage = (event) => {
    const data = new Uint8Array(event.data);

    try {
      const result = node.process_incoming(data);

      if (result.msg_type === 'msg2') {
        log('log-hs', `Received msg2 — ${result.info}`);
        setStatus('Established', 'connected');
        $msg.disabled = false;
        $btnSend.disabled = false;
      } else if (result.msg_type.startsWith('data_')) {
        const text = result.payload
          ? new TextDecoder().decode(new Uint8Array(result.payload))
          : '';
        log('log-recv', `← [${result.msg_type}] ${text}`);
        if (result.info) log('log-info', `  ${result.info}`);
      } else if (result.msg_type === 'replay') {
        log('log-err', `Replay: ${result.info}`);
      } else {
        log('log-info', `Received: ${result.msg_type}`);
        if (result.info) log('log-info', `  ${result.info}`);
      }
    } catch (e) {
      log('log-err', `Processing error: ${e}`);
    }
  };

  ws.onclose = () => {
    log('log-info', 'WebSocket closed.');
    setStatus('Disconnected', 'disconnected');
    $msg.disabled = true;
    $btnSend.disabled = true;
    $btnConnect.disabled = false;
    ws = null;
  };

  ws.onerror = (event) => {
    log('log-err', `WebSocket error.`);
    setStatus('Disconnected', 'disconnected');
    $btnConnect.disabled = false;
  };
});

// ── Send ──────────────────────────────────────────────

function send() {
  const text = $msg.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN || !node.is_established()) return;

  const payload = new TextEncoder().encode(text);
  try {
    const pkt = node.send_data(payload);
    ws.send(pkt);
    log('log-send', `→ ${text} (${pkt.length} bytes on wire)`);
    $msg.value = '';
  } catch (e) {
    log('log-err', `Send error: ${e}`);
  }
}

$btnSend.addEventListener('click', send);
$msg.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
