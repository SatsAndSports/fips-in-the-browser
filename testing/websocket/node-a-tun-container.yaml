# Node A — WebSocket + TUN server for containerized browser testing
#
# Intended for running inside Docker or Podman as a single container.
#
# Exposes:
#   - WebSocket server on 0.0.0.0:8080 (publish to host with -p 8080:8080)
# Uses outbound UDP to peer with the external VPS node at 217.77.8.91:2121.
# Uses:
#   - TUN interface fips0 with MTU 1280
#
# No DNS. Includes UDP transport for peering with the broader FIPS network.

node:
  identity:
    nsec: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
  control:
    socket_path: "/tmp/fips-ws-test/control-a.sock"

tun:
  enabled: true
  name: "fips0"
  mtu: 1280

dns:
  enabled: false

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    mtu: 1472
  websocket:
    bind_addr: "0.0.0.0:8080"

peers:
  - npub: "npub1qmc3cvfz0yu2hx96nq3gp55zdan2qclealn7xshgr448d3nh6lks7zel98"
    alias: "node-vps"
    addresses:
      - transport: udp
        addr: "217.77.8.91:2121"
    connect_policy: auto_connect
