<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIPS Browser Node</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --muted: #888;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #c084fc;
    --mono: "Fira Code", "Cascadia Code", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 1.25rem;
    width: 100%;
    max-width: 700px;
    margin-bottom: 1rem;
  }
  .panel-title {
    font-size: 0.85rem;
    color: var(--blue);
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 0.4rem;
  }
  label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.45rem 0.6rem;
    margin-bottom: 0.6rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--highlight); }
  .info-row {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    word-break: break-all;
  }
  .info-row span { color: var(--text); }
  button {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 0.45rem 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-right: 0.5rem;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-connect { background: var(--highlight); color: #fff; }
.btn-session { background: var(--purple); color: #fff; }
.btn-send { background: var(--green); color: #111; }
.btn-ping { background: var(--blue); color: #111; }
  .status { font-size: 0.78rem; margin-top: 0.5rem; }
  .status.connected { color: var(--green); }
  .status.disconnected { color: var(--red); }
  .status.connecting { color: #facc15; }
  .status.handshaking { color: var(--purple); }
  #sendRow { display: flex; gap: 0.5rem; }
  #sendRow input { flex: 1; margin-bottom: 0; }
  #log {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.75rem;
    height: 350px;
    overflow-y: auto;
    font-size: 0.72rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-send { color: var(--green); }
  .log-recv { color: var(--blue); }
  .log-info { color: var(--muted); }
  .log-err  { color: var(--red); }
  .log-hs   { color: var(--purple); }
  .log-chat { color: #fbbf24; }
</style>
</head>
<body>

<h1>FIPS Browser Node</h1>
<p class="subtitle">end-to-end encrypted sessions over WebSocket</p>

<!-- Identity panel -->
<div class="panel">
  <div class="panel-title">Identity</div>
  <div class="info-row">npub: <span id="myNpub">loading WASM...</span></div>
  <div class="info-row">addr: <span id="myAddr"></span></div>
</div>

<!-- Link connection panel -->
<div class="panel">
  <div class="panel-title">1. Connect to Gateway Node (Noise IK link)</div>
  <label for="url">WebSocket URL</label>
  <input type="text" id="url" value="ws://localhost:8080">
  <label for="remoteNpub">Gateway node npub</label>
  <input type="text" id="remoteNpub" placeholder="npub1...">
  <div>
    <button class="btn-connect" id="btnConnect" disabled>Connect</button>
  </div>
  <div class="status disconnected" id="status">Loading WASM...</div>
</div>

<!-- Session panel -->
<div class="panel">
  <div class="panel-title">2. Start Session with Remote Node (Noise XK)</div>
  <label for="sessionNpub">Remote node npub (paste from other browser)</label>
  <input type="text" id="sessionNpub" placeholder="npub1..." disabled>
  <div>
    <button class="btn-session" id="btnSession" disabled>Connect Session</button>
  </div>
  <div class="status disconnected" id="sessionStatus">No session</div>
</div>

<!-- Chat panel -->
<div class="panel">
  <div class="panel-title">3. Chat / Ping</div>
  <div style="margin-bottom: 0.75rem;">
    <button class="btn-ping" id="btnPing" disabled>Send Ping</button>
  </div>
  <div id="sendRow">
    <input type="text" id="msg" placeholder="Type a message..." disabled>
    <button class="btn-send" id="btnSend" disabled>Send</button>
  </div>
</div>

<!-- Log panel -->
<div class="panel">
  <div class="panel-title">Protocol Log</div>
  <div id="log"></div>
</div>

<script type="module">
import init, { FipsNode } from '../pkg/fips_wasm.js';

const $myNpub        = document.getElementById('myNpub');
const $myAddr        = document.getElementById('myAddr');
const $url           = document.getElementById('url');
const $remoteNpub    = document.getElementById('remoteNpub');
const $btnConnect    = document.getElementById('btnConnect');
const $status        = document.getElementById('status');
const $sessionNpub   = document.getElementById('sessionNpub');
const $btnSession    = document.getElementById('btnSession');
const $sessionStatus = document.getElementById('sessionStatus');
const $btnPing       = document.getElementById('btnPing');
const $msg           = document.getElementById('msg');
const $btnSend       = document.getElementById('btnSend');
const $log           = document.getElementById('log');

let node = null;
let ws = null;
let sessionDest = null; // npub of the session peer

function connectLink() {
  const url = $url.value.trim();
  const remoteNpub = $remoteNpub.value.trim();
  if (!url || !remoteNpub) {
    log('log-err', '[link]', 'URL and gateway npub are required.');
    return;
  }

  $btnConnect.disabled = true;
  setStatus('Connecting...', 'connecting');
  log('log-info', '[link]', `Connecting to ${url}...`);

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    log('log-info', '[link]', 'WebSocket connected.');
    setStatus('Handshaking...', 'handshaking');
    log('log-hs', '[link]', `Initiating Noise IK handshake with ${remoteNpub.slice(0,12)}...`);
    try {
      const msg1 = node.initiate_handshake(remoteNpub);
      log('log-hs', '[link]', `Sent IK msg1 (${msg1.length} bytes)`);
      ws.send(msg1);
    } catch (e) {
      log('log-err', '[link]', `Handshake failed: ${e}`);
      setStatus('Disconnected', 'disconnected');
      $btnConnect.disabled = false;
    }
  };

  ws.onmessage = (event) => {
    const data = new Uint8Array(event.data);
    try {
      const result = node.process_incoming(data);

      // Dispatch by msg_type
      if (result.msg_type === 'msg2') {
        log('log-hs', '[link]', `← ${result.info}`);
        setStatus('Link Established', 'connected');
        $sessionNpub.disabled = false;
        $btnSession.disabled = false;
      } else if (result.msg_type === 'session') {
        log('log-hs', '[sess]', `← ${result.info}`);
        if (result.session_peer_npub) {
          sessionDest = result.session_peer_npub;
          $sessionNpub.value = sessionDest;
        }
        if (sessionDest && node.is_session_established(sessionDest)) {
          setSessionStatus('Session Established', 'connected');
          $btnPing.disabled = false;
          $msg.disabled = false;
          $btnSend.disabled = false;
          $btnSession.disabled = true;
        }
      } else if (result.msg_type === 'session_chat') {
        log('log-chat', '[chat]', `← ${result.info}`);
      } else if (result.msg_type === 'ping_request') {
        log('log-info', '[ping]', `← ${result.info}`);
      } else if (result.msg_type === 'ping_reply') {
        log('log-info', '[ping]', `← ${result.info}`);
      } else if (result.msg_type === 'sender_report') {
        // Don't log every sender report — too noisy
      } else if (result.msg_type === 'heartbeat' || result.msg_type === 'receiver_report') {
        // Silent
      } else if (result.msg_type === 'tree_announce' || result.msg_type === 'filter_announce') {
        // Log briefly
        log('log-info', '[mesh]', `← ${result.info}`);
      } else if (result.msg_type === 'replay') {
        log('log-err', '[link]', `Replay: ${result.info}`);
      } else {
        if (result.info) log('log-info', '[misc]', `← [${result.msg_type}] ${result.info}`);
      }

      // Send any responses
      if (result.responses && result.responses.length > 0) {
        for (const resp of result.responses) {
          ws.send(new Uint8Array(resp));
        }
      }
    } catch (e) {
      log('log-err', '[proc]', `Processing error: ${e}`);
    }
  };

  ws.onclose = () => {
    log('log-info', '[link]', 'WebSocket closed.');
    setStatus('Disconnected', 'disconnected');
    $btnConnect.disabled = false;
    $sessionNpub.disabled = true;
    $btnSession.disabled = true;
    $btnPing.disabled = true;
    $msg.disabled = true;
    $btnSend.disabled = true;
    ws = null;
  };

  ws.onerror = () => {
    log('log-err', '[link]', 'WebSocket error.');
    setStatus('Disconnected', 'disconnected');
    $btnConnect.disabled = false;
  };
}

function utcTime() {
  return new Date().toISOString().slice(11);
}

function log(cls, prefix, text) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = `${utcTime()} ${prefix} ${text}\n`;
  $log.appendChild(span);
  $log.scrollTop = $log.scrollHeight;
}

function setStatus(text, cls) {
  $status.textContent = text;
  $status.className = 'status ' + cls;
}

function setSessionStatus(text, cls) {
  $sessionStatus.textContent = text;
  $sessionStatus.className = 'status ' + cls;
}

// ── Initialize WASM ───────────────────────────────────

await init();

// Auto-fill gateway settings from URL fragment:
//   #url=ws%3A%2F%2Flocalhost%3A8080&gateway=npub1...
const hashParams = new URLSearchParams(window.location.hash.slice(1));
const hashUrl = hashParams.get('url');
const hashGateway = hashParams.get('gateway');
if (hashUrl) $url.value = hashUrl;
if (hashGateway) $remoteNpub.value = hashGateway;

node = new FipsNode();
$myNpub.textContent = node.npub();
$myAddr.textContent = node.node_addr_hex();
$btnConnect.disabled = false;
setStatus('Ready', 'disconnected');
log('log-info', '[init]', `WASM loaded. Browser FIPS node initialized.`);
log('log-info', '[init]', `npub: ${node.npub()}`);
log('log-info', '[init]', `addr: ${node.node_addr_hex()}`);

if ($url.value.trim() && $remoteNpub.value.trim()) {
  log('log-info', '[link]', 'Gateway settings loaded from URL fragment; auto-connecting.');
  connectLink();
}

// ── 1. Link Connect ──────────────────────────────────

$btnConnect.addEventListener('click', connectLink);

// ── 2. Session Connect ───────────────────────────────

$btnSession.addEventListener('click', () => {
  const destNpub = $sessionNpub.value.trim();
  if (!destNpub) { log('log-err', '[sess]', 'Remote npub is required.'); return; }

  if (node.is_session_established(destNpub)) {
    sessionDest = destNpub;
    setSessionStatus('Session Established', 'connected');
    $btnPing.disabled = false;
    $msg.disabled = false;
    $btnSend.disabled = false;
    $btnSession.disabled = true;
    log('log-info', '[sess]', 'Session already established. Ready to chat.');
    return;
  }

  sessionDest = destNpub;
  setSessionStatus('Initiating XK handshake...', 'handshaking');
  log('log-hs', '[sess]', `Initiating Noise XK session with ${destNpub.slice(0,12)}...`);

  try {
    const pkt = node.connect_session(destNpub);
    ws.send(pkt);
    log('log-hs', '[sess]', `Sent SessionSetup (XK msg1, ${pkt.length} bytes on wire)`);
    $btnSession.disabled = true;
  } catch (e) {
    if (String(e).includes('already established')) {
      setSessionStatus('Session Established', 'connected');
      $btnPing.disabled = false;
      $msg.disabled = false;
      $btnSend.disabled = false;
      $btnSession.disabled = true;
      log('log-info', '[sess]', 'Session already established. Ready to chat.');
    } else {
      log('log-err', '[sess]', `Session initiation failed: ${e}`);
      setSessionStatus('Failed', 'disconnected');
    }
  }
});

// ── 3. Chat Send ─────────────────────────────────────

function sendChat() {
  const text = $msg.value.trim();
  if (!text || !ws || !sessionDest) return;

  try {
    const pkt = node.send_message(sessionDest, text);
    ws.send(pkt);
    log('log-send', '[chat]', `→ ${text}`);
    $msg.value = '';
  } catch (e) {
    log('log-err', '[chat]', `Send error: ${e}`);
  }
}

function sendPing() {
  if (!ws || !sessionDest) return;

  try {
    const pkt = node.send_ping(sessionDest);
    ws.send(pkt);
    log('log-send', '[ping]', `→ ICMPv6 Echo Request`);
  } catch (e) {
    log('log-err', '[ping]', `Ping error: ${e}`);
  }
}

$btnPing.addEventListener('click', sendPing);
$btnSend.addEventListener('click', sendChat);
$msg.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
