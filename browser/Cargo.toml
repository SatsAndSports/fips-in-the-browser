[package]
name = "fips-wasm"
version = "0.1.0"
edition = "2021"
description = "FIPS protocol implementation for WebAssembly (browser FIPS node)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Elliptic curve (k256 = pure-Rust secp256k1, easy WASM compilation)
k256 = { version = "0.13", features = ["ecdh", "schnorr"] }

# Symmetric crypto (same crates as native fips)
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"

# Random number generation (getrandom/js enables crypto.getRandomValues in browser)
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Bech32 encoding for npub/nsec
bech32 = "0.11"
hex = "0.4"

# WASM bindings
js-sys = "0.3"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
