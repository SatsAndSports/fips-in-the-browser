<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTransport Datagram Demo</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eee;
    --muted: #888;
    --green: #4ade80;
    --red: #f87171;
    --mono: "Fira Code", "Cascadia Code", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 1.25rem;
    width: 100%;
    max-width: 640px;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.5rem 0.6rem;
    margin-bottom: 0.75rem;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--highlight);
  }
  button {
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-connect {
    background: var(--highlight);
    color: #fff;
  }
  .btn-disconnect {
    background: var(--red);
    color: #fff;
    margin-left: 0.5rem;
  }
  .btn-send {
    background: var(--green);
    color: #111;
  }
  .status {
    font-size: 0.8rem;
    margin-top: 0.5rem;
  }
  .status.connected { color: var(--green); }
  .status.disconnected { color: var(--red); }
  .status.connecting { color: #facc15; }

  #sendRow {
    display: flex;
    gap: 0.5rem;
  }
  #sendRow input {
    flex: 1;
    margin-bottom: 0;
  }
  #log {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.75rem;
    height: 320px;
    overflow-y: auto;
    font-size: 0.78rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log-send { color: var(--green); }
  .log-recv { color: #60a5fa; }
  .log-info { color: var(--muted); }
  .log-err  { color: var(--red); }
</style>
</head>
<body>

<h1>WebTransport Datagram Demo</h1>
<p class="subtitle">unreliable, unordered QUIC datagrams via the browser</p>

<!-- Connection panel -->
<div class="panel">
  <label for="url">Server URL</label>
  <input type="text" id="url" value="https://localhost:4433">

  <label for="hash">Certificate SHA-256 hash (colon-separated hex from server output)</label>
  <input type="text" id="hash" placeholder="aa:bb:cc:dd:...">

  <div>
    <button class="btn-connect" id="btnConnect">Connect</button>
    <button class="btn-disconnect" id="btnDisconnect" disabled>Disconnect</button>
  </div>
  <div class="status disconnected" id="status">Disconnected</div>
</div>

<!-- Send panel -->
<div class="panel">
  <label for="msg">Send a datagram</label>
  <div id="sendRow">
    <input type="text" id="msg" placeholder="Type a message..." disabled>
    <button class="btn-send" id="btnSend" disabled>Send</button>
  </div>
</div>

<!-- Log panel -->
<div class="panel">
  <label>Log</label>
  <div id="log"></div>
</div>

<script>
"use strict";

// ── DOM refs ──────────────────────────────────────────
const $url           = document.getElementById("url");
const $hash          = document.getElementById("hash");
const $btnConnect    = document.getElementById("btnConnect");
const $btnDisconnect = document.getElementById("btnDisconnect");
const $status        = document.getElementById("status");
const $msg           = document.getElementById("msg");
const $btnSend       = document.getElementById("btnSend");
const $log           = document.getElementById("log");

let transport = null;
let writer    = null;  // DatagramWriter
let reader    = null;  // DatagramReader

// ── Helpers ───────────────────────────────────────────

/** Convert "aa:bb:cc:..." hex string to Uint8Array */
function hexToBytes(hex) {
  return new Uint8Array(
    hex.split(":").map(h => parseInt(h.trim(), 16))
  );
}

function log(cls, text) {
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = text + "\n";
  $log.appendChild(span);
  $log.scrollTop = $log.scrollHeight;
}

function setConnected(yes) {
  $btnConnect.disabled    = yes;
  $btnDisconnect.disabled = !yes;
  $msg.disabled           = !yes;
  $btnSend.disabled       = !yes;
  $url.disabled           = yes;
  $hash.disabled          = yes;
  $status.textContent     = yes ? "Connected" : "Disconnected";
  $status.className       = "status " + (yes ? "connected" : "disconnected");
}

function setConnecting() {
  $btnConnect.disabled = true;
  $status.textContent  = "Connecting...";
  $status.className    = "status connecting";
}

// ── Connect ───────────────────────────────────────────

async function connect() {
  const url  = $url.value.trim();
  const hash = $hash.value.trim();

  if (!url) { log("log-err", "URL is required"); return; }
  if (!hash) { log("log-err", "Certificate hash is required"); return; }

  setConnecting();
  log("log-info", `Connecting to ${url}...`);

  const hashBytes = hexToBytes(hash);
  if (hashBytes.length !== 32) {
    log("log-err", `Hash must be 32 bytes (got ${hashBytes.length}). Check format.`);
    setConnected(false);
    return;
  }

  try {
    transport = new WebTransport(url, {
      serverCertificateHashes: [{
        algorithm: "sha-256",
        value: hashBytes.buffer,
      }],
    });

    // Wait for the connection to be ready.
    await transport.ready;
    log("log-info", "Connection established!");
    setConnected(true);

    // Start reading incoming datagrams.
    reader = transport.datagrams.readable.getReader();
    readDatagrams();

    // Get a writer for outgoing datagrams.
    writer = transport.datagrams.writable.getWriter();

    // Watch for the connection closing.
    transport.closed.then(() => {
      log("log-info", "Connection closed by server.");
      cleanup();
    }).catch(e => {
      log("log-err", `Connection closed: ${e}`);
      cleanup();
    });

  } catch (e) {
    log("log-err", `Failed to connect: ${e}`);
    cleanup();
  }
}

// ── Read loop ─────────────────────────────────────────

async function readDatagrams() {
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const text = new TextDecoder().decode(value);
      log("log-recv", `← ${text}`);
    }
  } catch (e) {
    // Reader will throw when the connection closes — that's normal.
    if (transport) {
      log("log-err", `Read error: ${e}`);
    }
  }
}

// ── Send ──────────────────────────────────────────────

async function send() {
  const text = $msg.value.trim();
  if (!text || !writer) return;

  const encoded = new TextEncoder().encode(text);
  try {
    await writer.write(encoded);
    log("log-send", `→ ${text}`);
    $msg.value = "";
  } catch (e) {
    log("log-err", `Send error: ${e}`);
  }
}

// ── Disconnect / cleanup ──────────────────────────────

function cleanup() {
  writer = null;
  reader = null;
  if (transport) {
    try { transport.close(); } catch (_) {}
    transport = null;
  }
  setConnected(false);
}

// ── Event wiring ──────────────────────────────────────

$btnConnect.addEventListener("click", connect);
$btnDisconnect.addEventListener("click", () => {
  log("log-info", "Disconnecting...");
  cleanup();
});
$btnSend.addEventListener("click", send);
$msg.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

// Auto-fill cert hash from URL fragment (e.g. index.html#aa:bb:cc:...).
const fragment = window.location.hash.slice(1);
if (fragment && fragment.includes(":")) {
  $hash.value = fragment;
}

// Check browser support on load.
if (typeof WebTransport === "undefined") {
  log("log-err", "This browser does not support WebTransport.");
  log("log-err", "Use a recent version of Chrome, Edge, or Opera.");
  $btnConnect.disabled = true;
} else if ($hash.value) {
  log("log-info", "Cert hash loaded from URL — auto-connecting...");
  connect();
} else {
  log("log-info", "WebTransport is supported. Paste the server cert hash and click Connect.");
}
</script>
</body>
</html>
